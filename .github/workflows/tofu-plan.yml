jobs:
  plan:
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN_QEZTA: ${{ secrets.QEZTA_INFRA_TOKEN }}
      TF_ENCRYPTION: ${{ secrets.TF_ENCRYPTION }}
      TOFU_REMOTE_STATE: 'true'
    if: vars.REMOTE_STATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
    - name: Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
    - name: Plan
      run: |-
        set -o pipefail
        nix develop ../.. -c terragrunt plan -no-color -lock=false 2>&1 | tee plan.txt
      working-directory: orgs/Qezta
    - env:
        GH_TOKEN: ${{ github.token }}
      if: always()
      name: Comment plan
      run: |-
        {
          echo "### \`tofu plan\` (orgs/Qezta)"
          echo '```'
          tail -c 60000 plan.txt
          echo '```'
        } > comment.md
        gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
      working-directory: orgs/Qezta
    timeout-minutes: 30
name: tofu plan
'on':
  pull_request:
    paths:
    - root.hcl
    - orgs/**
    - terranix/**
    - data/**
    - flake.lock
permissions:
  contents: read
  pull-requests: write
